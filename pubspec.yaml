name: juniper_journal
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

# -----------------------------
# Dependencies
# -----------------------------
dependencies:
  crypto: ^3.0.6
  shared_preferences: ^2.5.3
  web: ^1.1.1
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.10.3
  table_calendar: ^3.1.1

  intl: ^0.20.2
  image_picker: ^1.0.7
  file_selector: ^1.0.4
  fleather: ^1.27.0
  flutter_math_fork: ^0.7.2
  flutter_bloc: ^8.1.3
  flutter_svg: ^2.2.0
  url_launcher: ^6.3.3
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# -----------------------------
# Flutter Configuration
# -----------------------------
flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/about/
    - assets/workshops/
    - assets/create_menu/
    - assets/discovery/
    - assets/impact/
    - assets/learning_module/
    - assets/project_setup/
    - assets/prototyping/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
