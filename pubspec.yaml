name: juniper_journal
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

# -----------------------------
# Dependencies
# -----------------------------
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.10.3
  table_calendar: ^3.1.1

  intl: ^0.20.2
  image_picker: ^1.0.7
  file_selector: ^1.0.4
  fleather: ^1.27.0
  flutter_math_fork: ^0.7.2
  flutter_bloc: ^8.1.3
  flutter_svg: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# -----------------------------
# Flutter Configuration
# -----------------------------
flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/create_menu/
    - assets/discovery/
    - assets/impact/
    - assets/learning_module/
    - assets/project_setup/
    - assets/prototyping/
