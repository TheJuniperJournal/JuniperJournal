<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Document sustainability projects, collaborate, and learn with Juniper Journal.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Juniper Journal">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Juniper Journal</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="app-loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:white;color:#5DB075;font:16px system-ui,sans-serif">Loading Juniper Journal…</div>
  <script>window.addEventListener('flutter-first-frame', function () { document.getElementById('app-loading')?.remove(); });</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
